<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./includes/bootstrap-4.6.2-dist/css/bootstrap.min.css">
    <script src="./includes/jquery.min.js"></script>
    <script src="./includes/bootstrap-4.6.2-dist/js/bootstrap.bundle.min.js"></script>
    <link href="./includes/summernote-bs4.min.css" rel="stylesheet">
    <script src="./includes/summernote-bs4.min.js"></script>
    <title>Teste Summernote</title>
</head>
<body>
    <h1>Summernote</h1>
    <label for="bodyEmail">Corpo do email</label>
    <div id="sumnot_bodyEmail"></div>
    <textarea id="bodyEmail" name="bodyEmail" rows="10" hidden></textarea>
<script>

    $('#sumnot_bodyEmail').summernote({
  placeholder: 'Coloque o conteúdo do seu email aqui...',
  height: 250,
  tabsize: 2,
  toolbar: [
    // [groupName, [list of button]]
    ['style', ['bold', 'italic', 'underline', 'hr', 'clear']],
    ['font', ['strikethrough', 'superscript', 'subscript']],
    ['fontname', ['fontname']],
    ['fontsize', ['fontsize']],
    ['color', ['color']],
    ['para', ['ul', 'ol', 'paragraph']],
    ['height', ['height']],
    ['table', ['table']],
    ['insert', ['link', 'picture']]
  ]
});

function numeroPorExtenso(numero) {
  const unidades = ["zero", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
  const dezenas = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
  const centenas = ["", "cem", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

  if (numero < 20) return unidades[numero];

  if (numero < 100) {
    const d = Math.floor(numero / 10);
    const u = numero % 10;
    return u === 0 ? dezenas[d] : `${dezenas[d]} e ${unidades[u]}`;
  }

  if (numero === 100) return "cem";

  if(numero < 1000) {
    const c = Math.floor(numero /100);
    const resto = numero % 100;

    if(resto === 0) {
      return centenas[c];
    } else {
      return `${centenas[c]} e ${numeroPorExtenso(resto)}`;
    }
  }

  if (numero === 1000) return "mil";

  // Para escopos maiores, a lógica se estende combinando milhares e centenas.
  return "Número maior que 1000 não tratado neste exemplo básico.";
}



</script>
    
</body>
</html>
